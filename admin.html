<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Blessings · Priya & Souvik</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><style>body{padding:20px}.admin-wrap{width:min(100%,520px);margin:0 auto;min-height:90vh;padding:36px 26px;background:var(--paper);border:1px solid var(--line);box-shadow:0 10px 35px #76634b1a}.admin-wrap h1{font:38px 'Cormorant Garamond',serif;text-align:center;color:#876257}.admin-wrap p{text-align:center;color:var(--muted)}.admin-wrap input{width:100%;padding:12px;border:1px solid var(--line);background:#fffaf4;font:16px Georgia;margin:10px 0}.admin-wrap button{padding:11px 17px;background:#a98a63;border:0;color:white;font:11px Marcellus;letter-spacing:1px;cursor:pointer}.blessing{padding:15px 0;border-bottom:1px solid var(--line)}.blessing strong{font:18px Georgia}.blessing time{float:right;font-size:11px;color:#a28d77}.blessing p{text-align:left;font:17px Georgia;line-height:1.45}.error{color:#a34d4d!important}</style></head><body><main class="admin-wrap"><p class="section-kicker">PRIYA & SOUVIK</p><h1>Private Blessings</h1><p>For the couple and their families</p><form id="login"><input id="password" type="password" placeholder="Private password" required autocomplete="current-password"><button>Unlock messages</button></form><p id="status" role="status"></p><div id="messages"></div><button id="logout" hidden>Sign out</button></main><script>
const login=document.getElementById('login'),status=document.getElementById('status'),messages=document.getElementById('messages'),logout=document.getElementById('logout');
async function load(){const r=await fetch('/api/admin/blessings');if(!r.ok)throw Error('Your session has expired. Please sign in again.');const d=await r.json();login.hidden=true;logout.hidden=false;messages.replaceChildren();if(!d.blessings.length){messages.textContent='No blessings have arrived yet.';return;}d.blessings.forEach(b=>{const el=document.createElement('article');el.className='blessing';const title=document.createElement('strong');title.textContent=b.name;const time=document.createElement('time');time.textContent=new Date(b.created_at+'Z').toLocaleString();const p=document.createElement('p');p.textContent=b.message;el.append(title,time,p);messages.append(el);});}
login.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Checking…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error);await load();status.textContent='';}catch(err){status.textContent=err.message;status.className='error';}});
logout.addEventListener('click',async()=>{await fetch('/api/admin/logout',{method:'POST'});login.hidden=false;logout.hidden=true;messages.replaceChildren();document.getElementById('password').value='';status.textContent='Signed out.';});
</script></body></html>
